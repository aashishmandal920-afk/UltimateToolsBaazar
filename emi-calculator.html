<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator - Omni Convertors</title>
    <link rel="stylesheet" href="style.css">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
    <style>
        .emi-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            align-items: center;
        }
        @media(max-width: 768px) {
            .emi-grid { grid-template-columns: 1fr; }
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .input-with-box {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color, #ccc);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-input, #fff);
        }
        .input-with-box span, .input-with-box input {
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            outline: none;
        }
        .input-with-box input {
            width: 100%;
            text-align: right;
            font-weight: bold;
            color: #10b981;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 8px;
            accent-color: #10b981;
            cursor: pointer;
        }
        .result-box-emi {
            background: var(--bg-card, #f8fafc);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color, #e2e8f0);
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .result-row span:last-child {
            font-weight: bold;
        }
        /* Donut Chart Style */
        .chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }
        .donut-chart {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: conic-gradient(#e2e8f0 0% 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .donut-hole {
            width: 105px;
            height: 105px;
            background: var(--bg-card, #fff);
            border-radius: 50%;
        }
        .chart-legend {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 13px;
            color: var(--text-muted, #64748b);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="tool-container" style="max-width: 950px; margin: 30px auto; padding: 30px;">
        <a href="index.html" class="back-link" style="display:inline-block; margin-bottom:15px; color:var(--primary); text-decoration:none;">← Back to Dashboard</a>
        <h2 style="color: var(--primary-blue); margin-bottom: 25px;">🏦 EMI Calculator</h2>
        
        <div class="emi-grid">
            <!-- Left: Inputs & Breakdown -->
            <div>
                <!-- Loan Amount -->
                <div class="input-group">
                    <label>Loan amount</label>
                    <div class="input-with-box">
                        <span>₹</span>
                        <input type="text" id="loanAmountText" value="10,00,000" oninput="updateFromText('amount')">
                    </div>
                    <input type="range" id="loanAmountRange" min="10000" max="10000000" step="10000" value="1000000" oninput="updateFromRange('amount')">
                </div>

                <!-- Interest Rate -->
                <div class="input-group">
                    <label>Rate of interest (p.a)</label>
                    <div class="input-with-box">
                        <input type="text" id="loanRateText" value="6.5" oninput="updateFromText('rate')">
                        <span>%</span>
                    </div>
                    <input type="range" id="loanRateRange" min="1" max="25" step="0.1" value="6.5" oninput="updateFromRange('rate')">
                </div>

                <!-- Loan Tenure -->
                <div class="input-group">
                    <label>Loan tenure</label>
                    <div class="input-with-box">
                        <input type="text" id="loanYearsText" value="5" oninput="updateFromText('years')">
                        <span>Yr</span>
                    </div>
                    <input type="range" id="loanYearsRange" min="1" max="30" step="1" value="5" oninput="updateFromRange('years')">
                </div>

                <!-- Results Summary -->
                <div class="result-box-emi" style="margin-top: 25px;">
                    <div class="result-row">
                        <span>Monthly EMI</span>
                        <span id="resEmi" style="color: var(--primary-blue); font-size: 18px;">₹ 19,566</span>
                    </div>
                    <div class="result-row">
                        <span>Principal amount</span>
                        <span id="resPrincipal">₹ 10,00,000</span>
                    </div>
                    <div class="result-row">
                        <span>Total interest</span>
                        <span id="resInterest" style="color: #6366f1;">₹ 1,73,969</span>
                    </div>
                    <div class="result-row" style="border-top: 1px solid var(--border-color); padding-top: 10px; font-weight: bold;">
                        <span>Total amount</span>
                        <span id="resTotal">₹ 11,73,969</span>
                    </div>
                </div>
            </div>

            <!-- Right: Donut Chart -->
            <div class="chart-container">
                <div class="chart-legend">
                    <div class="legend-item"><div class="legend-color" style="background: #e2e8f0;"></div>Principal amount</div>
                    <div class="legend-item"><div class="legend-color" style="background: #6366f1;"></div>Interest amount</div>
                </div>
                <div class="donut-chart" id="donutChart">
                    <div class="donut-hole"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatINR(num) {
            return '₹ ' + Number(num.toFixed(0)).toLocaleString('en-IN');
        }

        function calculateEMI() {
            let p = parseFloat(document.getElementById('loanAmountRange').value) || 0;
            let annualRate = parseFloat(document.getElementById('loanRateRange').value) || 0;
            let years = parseFloat(document.getElementById('loanYearsRange').value) || 0;

            let r = annualRate / 12 / 100;
            let n = years * 12;

            let emi = 0;
            if (r === 0) {
                emi = p / n;
            } else {
                emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            }

            let totalPayment = emi * n;
            let totalInterest = totalPayment - p;

            // Display Results
            document.getElementById('resEmi').innerText = formatINR(emi);
            document.getElementById('resPrincipal').innerText = formatINR(p);
            document.getElementById('resInterest').innerText = formatINR(totalInterest);
            document.getElementById('resTotal').innerText = formatINR(totalPayment);

            // Update Donut Chart
            let principalPercent = totalPayment > 0 ? (p / totalPayment) * 100 : 100;
            let interestPercent = 100 - principalPercent;
            let chart = document.getElementById('donutChart');
            chart.style.background = `conic-gradient(#6366f1 0% ${interestPercent}%, #e2e8f0 ${interestPercent}% 100%)`;
        }

        function updateFromRange(type) {
            if (type === 'amount') {
                let val = document.getElementById('loanAmountRange').value;
                document.getElementById('loanAmountText').value = Number(val).toLocaleString('en-IN');
            } else if (type === 'rate') {
                document.getElementById('loanRateText').value = document.getElementById('loanRateRange').value;
            } else if (type === 'years') {
                document.getElementById('loanYearsText').value = document.getElementById('loanYearsRange').value;
            }
            calculateEMI();
        }

        function updateFromText(type) {
            if (type === 'amount') {
                let raw = document.getElementById('loanAmountText').value.replace(/,/g, '');
                let val = parseFloat(raw) || 0;
                document.getElementById('loanAmountRange').value = val;
            } else if (type === 'rate') {
                let val = parseFloat(document.getElementById('loanRateText').value) || 0;
                document.getElementById('loanRateRange').value = val;
            } else if (type === 'years') {
                let val = parseFloat(document.getElementById('loanYearsText').value) || 0;
                document.getElementById('loanYearsRange').value = val;
            }
            calculateEMI();
        }

        window.onload = function() {
            calculateEMI();
        };
    </script>
</body>
</html>
