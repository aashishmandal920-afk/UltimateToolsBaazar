<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Combine PDF Files - Omni Convertors</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .pdf-list { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; padding: 20px; border: 2px dashed var(--border-color); border-radius: 8px; min-height: 150px; }
        .pdf-item { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; width: 200px; text-align: center; cursor: grab; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .pdf-item:active { cursor: grabbing; }
        .pdf-item span { display: block; font-size: 24px; margin-bottom: 10px; }
        .pdf-item p { font-size: 12px; word-break: break-all; margin: 0; }
        .action-btns { display: flex; gap: 10px; margin-top: 20px; }
        .action-btns button { flex: 1; }
    </style>
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div class="tool-container" style="max-width: 900px;">
        <h2 style="color: var(--primary-blue);">🔗 Combine PDF Files</h2>
        <p>Add files, drag to reorder, and merge them into one PDF.</p>
        
        <input type="file" id="pdfInput" accept=".pdf" multiple style="display: none;">
        <button onclick="document.getElementById('pdfInput').click()" class="action-btn">➕ Add PDF Files</button>
        
        <div class="pdf-list" id="pdfList">
            <!-- Files will appear here -->
        </div>

        <div class="action-btns">
            <button onclick="combinePDFs()" class="action-btn" style="background: #10b981;">🚀 Combine & Download PDF</button>
            <button onclick="clearFiles()" class="action-btn" style="background: #ef4444;">🗑️ Clear All</button>
        </div>
        <p id="statusMsg" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script>
        let selectedFiles = [];
        const pdfList = document.getElementById('pdfList');
        
        // Initialize SortableJS for drag and drop
        new Sortable(pdfList, {
            animation: 150,
            ghostClass: 'sortable-ghost'
        });

        document.getElementById('pdfInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if(file.type === "application/pdf") {
                    selectedFiles.push(file);
                    renderFiles();
                }
            });
            this.value = ''; // Reset input
        });

        function renderFiles() {
            pdfList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'pdf-item';
                div.setAttribute('data-index', index);
                div.innerHTML = `
                    <span>📄</span>
                    <p>${file.name}</p>
                    <p style="color: #ef4444; font-size: 10px; margin-top: 5px; cursor: pointer;" onclick="removeFile(${index})">❌ Remove</p>
                `;
                pdfList.appendChild(div);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFiles();
        }

        function clearFiles() {
            selectedFiles = [];
            renderFiles();
            document.getElementById('statusMsg').innerText = '';
        }

        async function combinePDFs() {
            if(selectedFiles.length < 2) {
                alert("Please add at least 2 PDF files to combine.");
                return;
            }

            const status = document.getElementById('statusMsg');
            status.style.color = "#3b82f6";
            status.innerText = "⏳ Merging PDFs... Please wait.";

            try {
                // Create a new PDF document
                const mergedPdf = await PDFLib.PDFDocument.create();

                // Get the actual order from the DOM (because of drag and drop)
                const items = document.querySelectorAll('.pdf-item');
                const orderedFiles = Array.from(items).map(item => selectedFiles[item.getAttribute('data-index')]);

                for (let file of orderedFiles) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                const mergedPdfBytes = await mergedPdf.save();
                const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                saveAs(blob, 'Combined_Document.pdf');

                status.style.color = "#10b981";
                status.innerText = "✅ PDF Combined and Downloaded Successfully!";
            } catch (error) {
                console.error(error);
                status.style.color = "#ef4444";
                status.innerText = "❌ Error combining PDFs. Please try again.";
            }
        }
    </script>
</body>
</html>
