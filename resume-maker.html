<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Professional Resume Maker - Omni Convertors</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;600;700&family=Nunito:wght@300;400;600;700&family=Raleway:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&family=Playfair+Display:wght@400;500;700&family=PT+Serif:wght@400;700&family=Crimson+Text:wght@400;600&family=Libre+Baskerville:wght@400;700&family=Josefin+Sans:wght@300;400;600&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    </script>

    <style>
        /* =========================================
           RESUME MAKER — ULTIMATE EDITION
           ========================================= */
        :root {
            --resume-primary: #2563eb;
            --resume-secondary: #1e40af;
            --resume-font: 'Inter', sans-serif;
            --resume-font-size: 13.5px;
            --resume-text-color: #333;
            --resume-bg-color: #ffffff;
            --resume-padding: 35px;
            --resume-line-height: 1.5;
            --resume-heading-font: 'Inter', sans-serif;
            --photo-shape: 50%;
        }

        * { box-sizing: border-box; }

        .resume-app-container {
            display: flex;
            height: calc(100vh - 100px);
            margin-top: 20px;
            background: var(--bg-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            border: 1px solid var(--border-color);
        }

        /* ============= LEFT PANEL ============= */
        .resume-form-panel {
            width: 420px;
            background: var(--bg-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            scrollbar-width: thin;
        }
        .resume-form-panel::-webkit-scrollbar { width: 6px; }
        .resume-form-panel::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }

        .form-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .form-header h2 { font-size: 16px; margin: 0; color: var(--primary-blue); }
        .form-header .btn-sm {
            font-size: 11px; padding: 6px 12px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }

        .accordion-item { border-bottom: 1px solid var(--border-color); }
        .accordion-header {
            padding: 14px 20px;
            background: rgba(0,0,0,0.02);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
            user-select: none;
        }
        .accordion-header:hover { background: rgba(0,0,0,0.05); }
        .accordion-header i.chev { transition: transform 0.3s; font-size: 12px; }
        .accordion-header.active i.chev { transform: rotate(180deg); }
        .accordion-content { padding: 20px; display: none; background: var(--bg-color); }
        .accordion-content.active { display: block; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 5px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit; font-size: 13px;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .form-group textarea { resize: vertical; min-height: 70px; font-family: inherit; }

        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        .dynamic-item {
            background: rgba(0,0,0,0.02);
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            border: 1px dashed var(--border-color);
            position: relative;
        }
        .dynamic-item .remove-btn {
            position: absolute; top: 8px; right: 10px;
            color: #ef4444; cursor: pointer; font-size: 13px;
            padding: 4px; border-radius: 4px; transition: 0.2s;
        }
        .dynamic-item .remove-btn:hover { background: rgba(239,68,68,0.1); }

        .add-btn {
            width: 100%; padding: 10px;
            background: rgba(37, 99, 235, 0.08);
            color: var(--primary-blue);
            border: 1px dashed var(--primary-blue);
            border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 12px; transition: 0.3s;
        }
        .add-btn:hover { background: var(--primary-blue); color: white; border-style: solid; }

        /* ============= RIGHT PANEL ============= */
        .resume-preview-panel {
            flex: 1; background: #3a3d42;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .preview-toolbar {
            padding: 8px 15px; background: #23262b;
            display: flex; justify-content: space-between;
            align-items: center; color: white;
            flex-wrap: wrap; gap: 8px;
            border-bottom: 1px solid #111;
        }
        .preview-toolbar .tool-group {
            display: flex; gap: 6px; align-items: center;
            font-size: 12px;
        }
        .preview-toolbar .tool-group label { color: #aaa; font-size: 11px; }
        .preview-toolbar select, .preview-toolbar input[type="color"] {
            padding: 5px 8px; border-radius: 4px;
            border: 1px solid #444; background: #1a1c20;
            color: white; cursor: pointer; font-size: 11px;
            font-family: inherit;
        }
        .preview-toolbar input[type="color"] { width: 32px; height: 28px; padding: 2px; }
        .preview-toolbar select:hover { border-color: #666; }

        .btn-download {
            padding: 6px 14px; background: #10b981; color: white;
            border: none; border-radius: 4px; cursor: pointer;
            font-weight: 600; font-size: 11px;
            display: flex; align-items: center; gap: 5px;
            transition: 0.2s;
        }
        .btn-download:hover { background: #059669; }

        .zoom-controls { display: flex; align-items: center; gap: 3px; background: #1a1c20; border-radius: 4px; padding: 2px; }
        .zoom-controls button {
            background: transparent; color: white; border: none;
            padding: 4px 8px; cursor: pointer; font-size: 12px; border-radius: 3px;
        }
        .zoom-controls button:hover { background: #333; }
        .zoom-controls span { font-size: 11px; padding: 0 4px; color: #ccc; min-width: 35px; text-align: center; }

        .preview-scroll-area {
            flex: 1; overflow: auto; padding: 30px;
            display: flex; justify-content: center; align-items: flex-start;
        }

        /* ============= A4 PAGE ============= */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            background: var(--resume-bg-color);
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            padding: var(--resume-padding);
            color: var(--resume-text-color);
            font-family: var(--resume-font);
            font-size: var(--resume-font-size);
            line-height: var(--resume-line-height);
            position: relative;
            box-sizing: border-box;
            transition: transform 0.2s;
            transform-origin: top center;
        }

        /* Background Patterns */
        .a4-page.bg-white { --resume-bg-color: #ffffff; }
        .a4-page.bg-cream { --resume-bg-color: #fdfaf3; }
        .a4-page.bg-gray { --resume-bg-color: #f5f5f5; }
        .a4-page.bg-offwhite { --resume-bg-color: #fafaf7; }

        .a4-page.bg-grid {
            background-color: #ffffff;
            background-image: 
                linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .a4-page.bg-dots {
            background-color: #ffffff;
            background-image: radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
            background-size: 15px 15px;
        }
        .a4-page.bg-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #f0f4ff 100%);
        }
        .a4-page.bg-subtle-lines {
            background-color: #ffffff;
            background-image: linear-gradient(rgba(37,99,235,0.03) 1px, transparent 1px);
            background-size: 100% 24px;
        }

        /* ============= RESUME HEADER ============= */
        .resume-header {
            display: flex; align-items: center; justify-content: center;
            gap: 25px; margin-bottom: 22px;
            padding-bottom: 18px; text-align: center;
        }
        .header-photo-container {
            width: 110px; height: 110px;
            overflow: hidden; flex-shrink: 0;
            display: none; background: #f0f0f0;
            border: 3px solid var(--resume-primary);
            border-radius: var(--photo-shape);
        }
        .header-photo-container img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; min-width: 0; }
        .resume-header h1 {
            font-size: 32px; margin: 0 0 5px 0;
            color: var(--resume-primary);
            text-transform: uppercase; letter-spacing: 2px;
            font-family: var(--resume-heading-font);
            font-weight: 700; line-height: 1.1;
        }
        .resume-header .job-title {
            font-size: 15px; font-weight: 600;
            color: #555; margin-bottom: 10px; letter-spacing: 0.5px;
        }
        .resume-header .contact-info {
            display: flex; justify-content: center;
            flex-wrap: wrap; gap: 6px 15px;
            font-size: 11.5px; color: #666;
        }
        .resume-header .contact-info span {
            display: flex; align-items: center; gap: 5px;
        }
        .resume-header .contact-info i { color: var(--resume-primary); }

        /* ============= SECTIONS ============= */
        .resume-section { margin-bottom: 18px; }
        .resume-section h2 {
            font-size: 14px; text-transform: uppercase;
            color: var(--resume-primary);
            padding-bottom: 5px; margin-bottom: 10px;
            letter-spacing: 1.5px;
            font-family: var(--resume-heading-font);
            font-weight: 700;
            border-bottom: 2px solid var(--resume-primary);
            display: flex; align-items: center; gap: 8px;
        }
        .resume-section h2 i { font-size: 13px; }

        .resume-item { margin-bottom: 14px; }
        .resume-item-header {
            display: flex; justify-content: space-between;
            align-items: baseline; margin-bottom: 3px;
            gap: 10px;
        }
        .resume-item-header h3 { font-size: 13.5px; margin: 0; font-weight: 700; color: #222; }
        .resume-item-header .date { font-size: 11.5px; color: #666; font-style: italic; white-space: nowrap; }
        .resume-item-sub { font-size: 12.5px; font-weight: 600; color: #444; margin-bottom: 4px; font-style: italic; }
        .resume-item p { font-size: 12.5px; margin: 0 0 4px 0; color: #555; }
        .resume-item ul { margin: 4px 0 0 0; padding-left: 18px; font-size: 12.5px; color: #555; }
        .resume-item ul li { margin-bottom: 3px; }

        /* Skills */
        .skills-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .skill-tag {
            background: rgba(37,99,235,0.1);
            color: var(--resume-primary);
            padding: 3px 12px; border-radius: 20px;
            font-size: 11.5px; font-weight: 600;
            border: 1px solid rgba(37,99,235,0.2);
        }

        /* Skill Bars */
        .skill-bar-item { margin-bottom: 10px; }
        .skill-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
        .skill-bar-track { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
        .skill-bar-fill { height: 100%; background: var(--resume-primary); border-radius: 3px; transition: width 0.5s; }

        /* Languages */
        .lang-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12.5px; }
        .lang-name { font-weight: 600; }
        .lang-level { color: #666; font-style: italic; font-size: 11.5px; }

        /* ============================================
           TEMPLATE VARIATIONS
           ============================================ */

        /* --- Template: MODERN --- */
        .a4-page.template-modern .resume-header { border-bottom: 2px solid var(--resume-primary); }
        .a4-page.template-modern .resume-header h1 { color: var(--resume-primary); }

        /* --- Template: CLASSIC --- */
        .a4-page.template-classic { --resume-font: 'Merriweather', serif; --resume-heading-font: 'Merriweather', serif; }
        .a4-page.template-classic .resume-header {
            text-align: left; border-bottom: 3px double #333;
            justify-content: flex-start;
        }
        .a4-page.template-classic .resume-header h1 { color: #1a1a1a; letter-spacing: 1px; }
        .a4-page.template-classic .resume-header .contact-info { justify-content: flex-start; }
        .a4-page.template-classic .resume-section h2 {
            color: #1a1a1a; border-bottom: 2px solid #1a1a1a;
            text-align: center; letter-spacing: 2px;
        }
        .a4-page.template-classic .skill-tag {
            background: transparent; color: #1a1a1a; border: 1px solid #1a1a1a;
        }

        /* --- Template: MINIMAL --- */
        .a4-page.template-minimal { --resume-primary: #111; --resume-font: 'Source Sans Pro', sans-serif; }
        .a4-page.template-minimal .resume-header { border-bottom: 1px solid #e5e5e5; text-align: left; }
        .a4-page.template-minimal .resume-header h1 { font-size: 36px; color: #111; letter-spacing: -0.5px; font-weight: 300; }
        .a4-page.template-minimal .resume-header .contact-info { justify-content: flex-start; }
        .a4-page.template-minimal .resume-section h2 {
            color: #111; border-bottom: 1px solid #e5e5e5;
            font-weight: 400; letter-spacing: 3px; font-size: 12px;
        }
        .a4-page.template-minimal .skill-tag { background: #f5f5f5; color: #333; border: none; }

        /* --- Template: EXECUTIVE --- */
        .a4-page.template-executive { --resume-font: 'Playfair Display', serif; --resume-heading-font: 'Playfair Display', serif; }
        .a4-page.template-executive .resume-header {
            text-align: center; border-bottom: none;
            padding: 25px 20px; margin: -35px -35px 25px -35px;
            background: var(--resume-primary);
            color: white;
        }
        .a4-page.template-executive .resume-header h1 { color: white; font-family: 'Playfair Display', serif; letter-spacing: 3px; }
        .a4-page.template-executive .resume-header .job-title { color: rgba(255,255,255,0.9); }
        .a4-page.template-executive .resume-header .contact-info { color: rgba(255,255,255,0.9); }
        .a4-page.template-executive .resume-header .contact-info i { color: white; }
        .a4-page.template-executive .resume-section h2 { color: var(--resume-primary); border-bottom: 1px solid #ddd; }
        .a4-page.template-executive .header-photo-container { border-color: white; }

        /* --- Template: CREATIVE (Two-Column) --- */
        .a4-page.template-creative {
            display: grid;
            grid-template-columns: 32% 1fr;
            padding: 0;
            gap: 0;
        }
        .a4-page.template-creative .resume-header { display: none; }
        .a4-page.template-creative .resume-sidebar {
            background: var(--resume-primary);
            color: white;
            padding: 30px 20px;
            min-height: 297mm;
        }
        .a4-page.template-creative .resume-main {
            padding: 30px 25px;
        }
        .a4-page.template-creative .resume-sidebar h2 {
            color: white; border-bottom: 1px solid rgba(255,255,255,0.3);
            font-size: 12px; letter-spacing: 1.5px;
        }
        .a4-page.template-creative .resume-sidebar .resume-item,
        .a4-page.template-creative .resume-sidebar p,
        .a4-page.template-creative .resume-sidebar span { color: rgba(255,255,255,0.92); }
        .a4-page.template-creative .resume-sidebar .skill-tag {
            background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3);
        }
        .a4-page.template-creative .resume-sidebar .skill-bar-track { background: rgba(255,255,255,0.2); }
        .a4-page.template-creative .resume-sidebar .skill-bar-fill { background: white; }
        .a4-page.template-creative .resume-main h2 {
            color: var(--resume-primary); border-bottom: 2px solid var(--resume-primary);
        }
        .a4-page.template-creative .sidebar-photo {
            width: 130px; height: 130px; margin: 0 auto 20px;
            border-radius: var(--photo-shape);
            overflow: hidden; border: 3px solid rgba(255,255,255,0.5);
        }
        .a4-page.template-creative .sidebar-photo img { width: 100%; height: 100%; object-fit: cover; }
        .a4-page.template-creative .sidebar-name { font-size: 22px; font-weight: 700; margin-bottom: 5px; line-height: 1.2; }
        .a4-page.template-creative .sidebar-title { font-size: 12px; opacity: 0.85; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .a4-page.template-creative .sidebar-contact { font-size: 11px; margin-bottom: 6px; word-break: break-word; display: flex; gap: 8px; align-items: flex-start; }
        .a4-page.template-creative .sidebar-contact i { margin-top: 3px; flex-shrink: 0; }

        /* --- Template: ELEGANT --- */
        .a4-page.template-elegant { --resume-font: 'Crimson Text', serif; --resume-heading-font: 'Playfair Display', serif; }
        .a4-page.template-elegant .resume-header {
            text-align: center; border-top: 1px solid #c9a96a;
            border-bottom: 1px solid #c9a96a;
            padding: 20px 0; margin-bottom: 25px;
        }
        .a4-page.template-elegant .resume-header h1 { color: #1a1a1a; letter-spacing: 4px; font-weight: 400; }
        .a4-page.template-elegant .resume-section h2 {
            color: #c9a96a; border-bottom: 1px solid #c9a96a;
            text-align: center; letter-spacing: 3px; font-weight: 400;
        }
        .a4-page.template-elegant .skill-tag { background: rgba(201,169,106,0.1); color: #8a6d3a; border: 1px solid rgba(201,169,106,0.3); }

        /* --- Template: BOLD --- */
        .a4-page.template-bold { --resume-font: 'Montserrat', sans-serif; --resume-heading-font: 'Montserrat', sans-serif; }
        .a4-page.template-bold .resume-header {
            background: #111; color: white;
            padding: 30px 25px; margin: -35px -35px 25px -35px;
            border-bottom: 6px solid var(--resume-primary);
        }
        .a4-page.template-bold .resume-header h1 { color: white; font-weight: 800; letter-spacing: 3px; font-size: 34px; }
        .a4-page.template-bold .resume-header .job-title { color: var(--resume-primary); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; font-size: 12px; }
        .a4-page.template-bold .resume-header .contact-info { color: rgba(255,255,255,0.8); }
        .a4-page.template-bold .resume-header .contact-info i { color: var(--resume-primary); }
        .a4-page.template-bold .resume-section h2 { color: #111; border-bottom: 3px solid #111; letter-spacing: 3px; font-weight: 800; }
        .a4-page.template-bold .header-photo-container { border-color: var(--resume-primary); }

        /* --- Template: COMPACT --- */
        .a4-page.template-compact { --resume-padding: 22px; --resume-font-size: 12px; --resume-line-height: 1.35; }
        .a4-page.template-compact .resume-header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .a4-page.template-compact .resume-header h1 { font-size: 26px; letter-spacing: 1px; }
        .a4-page.template-compact .resume-section { margin-bottom: 12px; }
        .a4-page.template-compact .resume-section h2 { font-size: 12px; margin-bottom: 8px; padding-bottom: 3px; }
        .a4-page.template-compact .resume-item { margin-bottom: 10px; }

        /* --- Template: TIMELINE --- */
        .a4-page.template-timeline .resume-header { text-align: left; border-bottom: 1px solid #ddd; }
        .a4-page.template-timeline .resume-header .contact-info { justify-content: flex-start; }
        .a4-page.template-timeline .resume-section { position: relative; padding-left: 30px; }
        .a4-page.template-timeline .resume-section::before {
            content: ''; position: absolute; left: 8px; top: 25px; bottom: 0;
            width: 2px; background: var(--resume-primary); opacity: 0.3;
        }
        .a4-page.template-timeline .resume-section h2 {
            border-bottom: none; padding-bottom: 0;
            position: relative; margin-left: -22px;
        }
        .a4-page.template-timeline .resume-section h2::before {
            content: ''; position: absolute; left: 0; top: 5px;
            width: 12px; height: 12px; background: var(--resume-primary);
            border-radius: 50%; border: 3px solid white;
            box-shadow: 0 0 0 2px var(--resume-primary);
        }
        .a4-page.template-timeline .resume-item-header h3::before {
            content: '▸ '; color: var(--resume-primary); font-weight: bold;
        }

        /* --- Template: TWO-COLUMN --- */
        .a4-page.template-twocolumn {
            display: grid;
            grid-template-columns: 1fr 32%;
            gap: 30px;
            padding: 35px 30px;
        }
        .a4-page.template-twocolumn .resume-header {
            grid-column: 1 / -1;
            border-bottom: 2px solid var(--resume-primary);
            text-align: left; padding-bottom: 15px;
        }
        .a4-page.template-twocolumn .resume-header .contact-info { justify-content: flex-start; }
        .a4-page.template-twocolumn .main-column { grid-column: 1 / 2; }
        .a4-page.template-twocolumn .side-column { grid-column: 2 / 3; background: rgba(37,99,235,0.05); padding: 15px; border-radius: 8px; }
        .a4-page.template-twocolumn .side-column .resume-section h2 { font-size: 12px; letter-spacing: 1px; }

        /* ============= HIDDEN DEFAULT SECTIONS ============= */
        .hidden { display: none !important; }

        /* ============= PRINT STYLES ============= */
        @media print {
            body * { visibility: hidden; }
            .resume-preview-panel, .resume-preview-panel * { visibility: visible; }
            .resume-preview-panel {
                position: absolute; left: 0; top: 0;
                width: 100%; height: auto;
                background: white; overflow: visible;
            }
            .preview-toolbar { display: none !important; }
            .preview-scroll-area { padding: 0; overflow: visible; display: block; }
            .a4-page {
                width: 100%; min-height: auto;
                box-shadow: none; margin: 0; padding: 15mm !important;
                transform: none !important;
            }
            .a4-page.template-creative { grid-template-columns: 32% 1fr; }
            .a4-page.template-creative .resume-sidebar { padding: 15mm 8mm; min-height: 297mm; }
            .a4-page.template-creative .resume-main { padding: 15mm 8mm; }
            .a4-page.template-executive .resume-header,
            .a4-page.template-bold .resume-header { margin: -15mm -15mm 25px -15mm; padding: 15mm; }
            .a4-page.template-twocolumn { gap: 20px; padding: 15mm; }
            .header-photo-container { display: block !important; }
            @page { size: A4; margin: 0; }
        }

        /* ============= RESPONSIVE ============= */
        @media (max-width: 1100px) {
            .resume-app-container { flex-direction: column; height: auto; }
            .resume-form-panel { width: 100%; max-height: 500px; border-right: none; border-bottom: 1px solid var(--border-color); }
            .resume-preview-panel { height: 700px; }
            .a4-page { transform: scale(0.7); }
        }
        @media (max-width: 600px) {
            .a4-page { transform: scale(0.5); }
            .preview-scroll-area { padding: 15px; }
            .preview-toolbar { font-size: 10px; }
        }

        /* Sortable ghost */
        .sortable-ghost { opacity: 0.4; background: rgba(37,99,235,0.1); }
    </style>
</head>
<body>

    <div class="header" style="margin-bottom: 10px;">
        <h1>📄 Ultimate Resume Maker — Pro Edition</h1>
        <p>10 Templates • 15+ Fonts • 8 Backgrounds • 100% Client-Side</p>
    </div>

    <div class="resume-app-container">
        
        <!-- ========== LEFT PANEL: FORM ========== -->
        <div class="resume-form-panel">
            <div class="form-header">
                <h2>📝 Resume Editor</h2>
                <button onclick="resetResume()" class="btn-sm btn-danger"><i class="fas fa-trash"></i> Reset All</button>
            </div>

            <!-- Personal Info -->
            <div class="accordion-item">
                <div class="accordion-header active" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-user"></i> Personal Information</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content active">
                    <div class="form-group">
                        <label>Profile Photo</label>
                        <input type="file" id="input-photo" accept="image/*" onchange="handlePhotoUpload(event)">
                    </div>
                    <div class="form-group"><label>Full Name</label><input type="text" id="input-name" oninput="updateData('name', this.value)" placeholder="John Doe"></div>
                    <div class="form-group"><label>Job Title</label><input type="text" id="input-jobTitle" oninput="updateData('jobTitle', this.value)" placeholder="Senior Software Engineer"></div>
                    <div class="form-row">
                        <div class="form-group"><label>Email</label><input type="email" id="input-email" oninput="updateData('email', this.value)" placeholder="john@example.com"></div>
                        <div class="form-group"><label>Phone</label><input type="text" id="input-phone" oninput="updateData('phone', this.value)" placeholder="+1 234 567 890"></div>
                    </div>
                    <div class="form-group"><label>Location</label><input type="text" id="input-location" oninput="updateData('location', this.value)" placeholder="New York, USA"></div>
                    <div class="form-row">
                        <div class="form-group"><label>LinkedIn</label><input type="text" id="input-linkedin" oninput="updateData('linkedin', this.value)" placeholder="linkedin.com/in/johndoe"></div>
                        <div class="form-group"><label>Website/Portfolio</label><input type="text" id="input-website" oninput="updateData('website', this.value)" placeholder="johndoe.com"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>GitHub</label><input type="text" id="input-github" oninput="updateData('github', this.value)" placeholder="github.com/johndoe"></div>
                        <div class="form-group"><label>Twitter/X</label><input type="text" id="input-twitter" oninput="updateData('twitter', this.value)" placeholder="@johndoe"></div>
                    </div>
                </div>
            </div>

            <!-- Summary -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-align-left"></i> Professional Summary</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div class="form-group">
                        <textarea id="input-summary" oninput="updateData('summary', this.value)" placeholder="Results-driven professional with X years of experience in..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Experience -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-briefcase"></i> Work Experience</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div id="experience-container"></div>
                    <button class="add-btn" onclick="addExperience()"><i class="fas fa-plus"></i> Add Experience</button>
                </div>
            </div>

            <!-- Education -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-graduation-cap"></i> Education</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div id="education-container"></div>
                    <button class="add-btn" onclick="addEducation()"><i class="fas fa-plus"></i> Add Education</button>
                </div>
            </div>

            <!-- Skills -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-cogs"></i> Skills</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div class="form-group">
                        <label>Skills (Comma separated)</label>
                        <textarea id="input-skills" oninput="updateData('skills', this.value)" placeholder="JavaScript, React, Node.js, Python, SQL"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Display Style</label>
                        <select id="skillStyle" onchange="updateData('skillStyle', this.value)">
                            <option value="tags">Tags</option>
                            <option value="bars">Progress Bars</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Languages -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-language"></i> Languages</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div id="languages-container"></div>
                    <button class="add-btn" onclick="addLanguage()"><i class="fas fa-plus"></i> Add Language</button>
                </div>
            </div>

            <!-- Projects -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-project-diagram"></i> Projects</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div id="projects-container"></div>
                    <button class="add-btn" onclick="addProject()"><i class="fas fa-plus"></i> Add Project</button>
                </div>
            </div>

            <!-- Certifications -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-certificate"></i> Certifications</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div id="certifications-container"></div>
                    <button class="add-btn" onclick="addCertification()"><i class="fas fa-plus"></i> Add Certification</button>
                </div>
            </div>

            <!-- Awards -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-trophy"></i> Awards & Achievements</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div id="awards-container"></div>
                    <button class="add-btn" onclick="addAward()"><i class="fas fa-plus"></i> Add Award</button>
                </div>
            </div>

            <!-- Hobbies -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-heart"></i> Hobbies & Interests</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div class="form-group">
                        <label>Hobbies (Comma separated)</label>
                        <textarea id="input-hobbies" oninput="updateData('hobbies', this.value)" placeholder="Photography, Reading, Traveling, Chess"></textarea>
                    </div>
                </div>
            </div>

            <!-- References -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span><i class="fas fa-users"></i> References</span>
                    <i class="fas fa-chevron-down chev"></i>
                </div>
                <div class="accordion-content">
                    <div id="references-container"></div>
                    <button class="add-btn" onclick="addReference()"><i class="fas fa-plus"></i> Add Reference</button>
                </div>
            </div>

        </div>

        <!-- ========== RIGHT PANEL: PREVIEW ========== -->
        <div class="resume-preview-panel">
            <div class="preview-toolbar">
                <div class="tool-group">
                    <i class="fas fa-layer-group"></i>
                    <select id="templateSelect" onchange="changeTemplate(this.value)">
                        <option value="modern">Modern</option>
                        <option value="classic">Classic</option>
                        <option value="minimal">Minimal</option>
                        <option value="executive">Executive</option>
                        <option value="creative">Creative (2-Col)</option>
                        <option value="elegant">Elegant</option>
                        <option value="bold">Bold</option>
                        <option value="compact">Compact</option>
                        <option value="timeline">Timeline</option>
                        <option value="twocolumn">Two-Column</option>
                    </select>
                </div>
                <div class="tool-group">
                    <i class="fas fa-font"></i>
                    <select id="fontSelect" onchange="changeFont(this.value)">
                        <option value="'Inter', sans-serif">Inter</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                        <option value="'Poppins', sans-serif">Poppins</option>
                        <option value="'Lato', sans-serif">Lato</option>
                        <option value="'Montserrat', sans-serif">Montserrat</option>
                        <option value="'Open Sans', sans-serif">Open Sans</option>
                        <option value="'Nunito', sans-serif">Nunito</option>
                        <option value="'Raleway', sans-serif">Raleway</option>
                        <option value="'Source Sans Pro', sans-serif">Source Sans Pro</option>
                        <option value="'Josefin Sans', sans-serif">Josefin Sans</option>
                        <option value="'Merriweather', serif">Merriweather</option>
                        <option value="'Playfair Display', serif">Playfair Display</option>
                        <option value="'PT Serif', serif">PT Serif</option>
                        <option value="'Crimson Text', serif">Crimson Text</option>
                        <option value="'Libre Baskerville', serif">Libre Baskerville</option>
                    </select>
                </div>
                <div class="tool-group">
                    <i class="fas fa-text-height"></i>
                    <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
                        <option value="11px">11</option>
                        <option value="12px">12</option>
                        <option value="13px">13</option>
                        <option value="13.5px" selected>13.5</option>
                        <option value="14px">14</option>
                        <option value="15px">15</option>
                        <option value="16px">16</option>
                    </select>
                </div>
                <div class="tool-group">
                    <i class="fas fa-palette"></i>
                    <input type="color" id="colorPicker" value="#2563eb" onchange="changeColor(this.value)" title="Accent Color">
                </div>
                <div class="tool-group">
                    <i class="fas fa-fill-drip"></i>
                    <select id="bgSelect" onchange="changeBackground(this.value)">
                        <option value="bg-white">White</option>
                        <option value="bg-cream">Cream</option>
                        <option value="bg-gray">Light Gray</option>
                        <option value="bg-offwhite">Off-White</option>
                        <option value="bg-grid">Grid</option>
                        <option value="bg-dots">Dots</option>
                        <option value="bg-gradient">Gradient</option>
                        <option value="bg-subtle-lines">Subtle Lines</option>
                    </select>
                </div>
                <div class="tool-group">
                    <i class="fas fa-user-circle"></i>
                    <select id="photoShapeSelect" onchange="changePhotoShape(this.value)">
                        <option value="50%">Circle</option>
                        <option value="8px">Rounded</option>
                        <option value="0%">Square</option>
                    </select>
                </div>
                <div class="tool-group zoom-controls">
                    <button onclick="changeZoom(-10)" title="Zoom Out"><i class="fas fa-minus"></i></button>
                    <span id="zoomLevel">100%</span>
                    <button onclick="changeZoom(10)" title="Zoom In"><i class="fas fa-plus"></i></button>
                </div>
                <div class="tool-group">
                    <button onclick="window.print()" class="btn-download">
                        <i class="fas fa-download"></i> PDF
                    </button>
                </div>
            </div>

            <div class="preview-scroll-area">
                <div class="a4-page template-modern bg-white" id="resumePreview">
                    <!-- Content gets rendered by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script>
        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        const defaultData = {
            photo: "", name: "", jobTitle: "", email: "", phone: "", location: "",
            linkedin: "", website: "", github: "", twitter: "",
            summary: "", skills: "", skillStyle: "tags", hobbies: "",
            experience: [], education: [], projects: [],
            languages: [], certifications: [], awards: [], references: []
        };

        let resumeData = JSON.parse(localStorage.getItem('omniUltimateResume')) || JSON.parse(JSON.stringify(defaultData));

        // Ensure arrays have at least one item
        if(!resumeData.experience || resumeData.experience.length === 0) resumeData.experience = [{ title: '', company: '', date: '', desc: '' }];
        if(!resumeData.education || resumeData.education.length === 0) resumeData.education = [{ degree: '', school: '', date: '', desc: '' }];
        if(!resumeData.projects || resumeData.projects.length === 0) resumeData.projects = [{ title: '', tech: '', desc: '' }];
        if(!resumeData.languages) resumeData.languages = [];
        if(!resumeData.certifications) resumeData.certifications = [];
        if(!resumeData.awards) resumeData.awards = [];
        if(!resumeData.references) resumeData.references = [];
        if(!resumeData.skillStyle) resumeData.skillStyle = 'tags';

        // Restore UI state
        let currentTemplate = localStorage.getItem('omniTemplate') || 'modern';
        let currentBg = localStorage.getItem('omniBg') || 'bg-white';
        let currentFont = localStorage.getItem('omniFont') || "'Inter', sans-serif";
        let currentFontSize = localStorage.getItem('omniFontSize') || '13.5px';
        let currentColor = localStorage.getItem('omniColor') || '#2563eb';
        let currentPhotoShape = localStorage.getItem('omniPhotoShape') || '50%';
        let currentZoom = 100;

        // ==========================================
        // ACCORDION
        // ==========================================
        function toggleAccordion(header) {
            header.classList.toggle('active');
            header.nextElementSibling.classList.toggle('active');
        }

        // ==========================================
        // PHOTO UPLOAD
        // ==========================================
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                resumeData.photo = e.target.result;
                saveData();
                renderPreview();
            };
            reader.readAsDataURL(file);
        }

        // ==========================================
        // DATA PERSISTENCE
        // ==========================================
        function saveData() {
            localStorage.setItem('omniUltimateResume', JSON.stringify(resumeData));
        }

        function updateData(field, value) {
            resumeData[field] = value;
            saveData();
            renderPreview();
        }

        // ==========================================
        // RENDER PREVIEW
        // ==========================================
        function renderPreview() {
            const preview = document.getElementById('resumePreview');
            
            // Apply current settings
            preview.className = `a4-page template-${currentTemplate} ${currentBg}`;
            document.documentElement.style.setProperty('--resume-font', currentFont);
            document.documentElement.style.setProperty('--resume-font-size', currentFontSize);
            document.documentElement.style.setProperty('--resume-primary', currentColor);
            document.documentElement.style.setProperty('--photo-shape', currentPhotoShape);

            // Build contact HTML
            const contacts = [];
            if(resumeData.email) contacts.push(`<span><i class="fas fa-envelope"></i> ${escapeHtml(resumeData.email)}</span>`);
            if(resumeData.phone) contacts.push(`<span><i class="fas fa-phone"></i> ${escapeHtml(resumeData.phone)}</span>`);
            if(resumeData.location) contacts.push(`<span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(resumeData.location)}</span>`);
            if(resumeData.linkedin) contacts.push(`<span><i class="fab fa-linkedin"></i> ${escapeHtml(resumeData.linkedin)}</span>`);
            if(resumeData.website) contacts.push(`<span><i class="fas fa-globe"></i> ${escapeHtml(resumeData.website)}</span>`);
            if(resumeData.github) contacts.push(`<span><i class="fab fa-github"></i> ${escapeHtml(resumeData.github)}</span>`);
            if(resumeData.twitter) contacts.push(`<span><i class="fab fa-twitter"></i> ${escapeHtml(resumeData.twitter)}</span>`);

            // Build sections
            const summaryHtml = resumeData.summary ? `
                <div class="resume-section" data-section="summary">
                    <h2><i class="fas fa-align-left"></i> Professional Summary</h2>
                    <p>${escapeHtml(resumeData.summary)}</p>
                </div>` : '';

            const experienceHtml = buildExperienceSection();
            const educationHtml = buildEducationSection();
            const skillsHtml = buildSkillsSection();
            const languagesHtml = buildLanguagesSection();
            const projectsHtml = buildProjectsSection();
            const certificationsHtml = buildCertificationsSection();
            const awardsHtml = buildAwardsSection();
            const hobbiesHtml = resumeData.hobbies ? `
                <div class="resume-section" data-section="hobbies">
                    <h2><i class="fas fa-heart"></i> Hobbies & Interests</h2>
                    <div class="skills-list">${resumeData.hobbies.split(',').map(h => `<span class="skill-tag">${escapeHtml(h.trim())}</span>`).join('')}</div>
                </div>` : '';
            const referencesHtml = buildReferencesSection();

            // Photo HTML
            const photoHtml = resumeData.photo ? `<img src="${resumeData.photo}" alt="Profile Photo">` : '';

            // Check template type
            if(currentTemplate === 'creative') {
                preview.innerHTML = `
                    <div class="resume-sidebar">
                        ${resumeData.photo ? `<div class="sidebar-photo">${photoHtml}</div>` : ''}
                        <div class="sidebar-name">${escapeHtml(resumeData.name) || 'Your Name'}</div>
                        <div class="sidebar-title">${escapeHtml(resumeData.jobTitle) || 'Job Title'}</div>
                        <div class="resume-section">
                            <h2>Contact</h2>
                            ${contacts.map(c => `<div class="sidebar-contact"><i class="${extractIcon(c)}"></i> ${extractText(c)}</div>`).join('')}
                        </div>
                        ${skillsHtml ? `<div class="resume-section">${skillsHtml.replace('<div class="resume-section" data-section="skills">','').replace('</div>','')}</div>` : ''}
                        ${languagesHtml}
                        ${hobbiesHtml}
                    </div>
                    <div class="resume-main">
                        ${summaryHtml}
                        ${experienceHtml}
                        ${educationHtml}
                        ${projectsHtml}
                        ${certificationsHtml}
                        ${awardsHtml}
                        ${referencesHtml}
                    </div>
                `;
            } else if(currentTemplate === 'twocolumn') {
                preview.innerHTML = `
                    <div class="resume-header">
                        ${resumeData.photo ? `<div class="header-photo-container" style="display:block">${photoHtml}</div>` : ''}
                        <div class="header-info">
                            <h1>${escapeHtml(resumeData.name) || 'Your Name'}</h1>
                            <div class="job-title">${escapeHtml(resumeData.jobTitle) || 'Job Title'}</div>
                            <div class="contact-info">${contacts.join('')}</div>
                        </div>
                    </div>
                    <div class="main-column">
                        ${summaryHtml}
                        ${experienceHtml}
                        ${educationHtml}
                        ${projectsHtml}
                    </div>
                    <div class="side-column">
                        ${skillsHtml}
                        ${languagesHtml}
                        ${certificationsHtml}
                        ${awardsHtml}
                        ${hobbiesHtml}
                        ${referencesHtml}
                    </div>
                `;
            } else {
                // Standard single-column layout
                preview.innerHTML = `
                    <div class="resume-header">
                        ${resumeData.photo ? `<div class="header-photo-container" style="display:block">${photoHtml}</div>` : ''}
                        <div class="header-info">
                            <h1>${escapeHtml(resumeData.name) || 'Your Name'}</h1>
                            <div class="job-title">${escapeHtml(resumeData.jobTitle) || 'Job Title'}</div>
                            <div class="contact-info">${contacts.join('')}</div>
                        </div>
                    </div>
                    ${summaryHtml}
                    ${experienceHtml}
                    ${educationHtml}
                    ${skillsHtml}
                    ${languagesHtml}
                    ${projectsHtml}
                    ${certificationsHtml}
                    ${awardsHtml}
                    ${hobbiesHtml}
                    ${referencesHtml}
                `;
            }
        }

        // ==========================================
        // SECTION BUILDERS
        // ==========================================
        function buildExperienceSection() {
            const valid = resumeData.experience.filter(e => e.title || e.company);
            if(valid.length === 0) return '';
            return `
                <div class="resume-section" data-section="experience">
                    <h2><i class="fas fa-briefcase"></i> Work Experience</h2>
                    ${valid.map(exp => `
                        <div class="resume-item">
                            <div class="resume-item-header">
                                <h3>${escapeHtml(exp.title) || 'Job Title'}</h3>
                                <span class="date">${escapeHtml(exp.date) || ''}</span>
                            </div>
                            <div class="resume-item-sub">${escapeHtml(exp.company) || 'Company'}</div>
                            ${exp.desc ? `<ul>${exp.desc.split('\n').map(l => l.trim() ? `<li>${escapeHtml(l)}</li>` : '').join('')}</ul>` : ''}
                        </div>
                    `).join('')}
                </div>`;
        }

        function buildEducationSection() {
            const valid = resumeData.education.filter(e => e.degree || e.school);
            if(valid.length === 0) return '';
            return `
                <div class="resume-section" data-section="education">
                    <h2><i class="fas fa-graduation-cap"></i> Education</h2>
                    ${valid.map(edu => `
                        <div class="resume-item">
                            <div class="resume-item-header">
                                <h3>${escapeHtml(edu.degree) || 'Degree'}</h3>
                                <span class="date">${escapeHtml(edu.date) || ''}</span>
                            </div>
                            <div class="resume-item-sub">${escapeHtml(edu.school) || 'School/University'}</div>
                            ${edu.desc ? `<p>${escapeHtml(edu.desc)}</p>` : ''}
                        </div>
                    `).join('')}
                </div>`;
        }

        function buildSkillsSection() {
            if(!resumeData.skills) return '';
            const skills = resumeData.skills.split(',').map(s => s.trim()).filter(s => s);
            if(skills.length === 0) return '';
            
            let content = '';
            if(resumeData.skillStyle === 'bars') {
                content = skills.map(s => `
                    <div class="skill-bar-item">

            return `

        // ==========================================
        // HELPERS
        // ==========================================
        function escapeHtml(text) {
            if(!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function extractIcon(html) {
            const match = html.match(/class="([^"]+)"/);
            return match ? match[1] : '';
        }

        function extractText(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            return div.textContent.trim();
        }

        // ==========================================

        function addExperience() {

                    <div class="form-group"><label>Date</label><input type="text" value="${escapeHtml(exp.date)}" oninput="updateExperience(${i}, 'date', this.value)" placeholder="Jan 2020 - Present"></div>
                    <div class="form-group"><label>Description (One point per line)</label><textarea oninput="updateExperience(${i}, 'desc', this.value)" placeholder="Developed web applications...">${escapeHtml(exp.desc)}</textarea></div>
                </div>

        }

        function updateExperience(i, field, value) {

        // ==========================================
        // TOOLBAR FUNCTIONS
        // ==========================================
        function changeTemplate(t) {
            currentTemplate = t;
            localStorage.setItem('omniTemplate', t);
            renderPreview();
        }

        function changeFont(f) {
            currentFont = f;
            localStorage.setItem('omniFont', f);
            renderPreview();
        }

        function changeFontSize(s) {
            currentFontSize = s;
            localStorage.setItem('omniFontSize', s);
            renderPreview();
        }

        function changeColor(c) {
            currentColor = c;
            localStorage.setItem('omniColor', c);
            renderPreview();
        }

        function changeBackground(b) {
            currentBg = b;
            localStorage.setItem('omniBg', b);
            renderPreview();
        }

        function changePhotoShape(s) {
            currentPhotoShape = s;
            localStorage.setItem('omniPhotoShape', s);
            renderPreview();
        }

        function changeZoom(delta) {
            currentZoom = Math.max(30, Math.min(150, currentZoom + delta));
            document.getElementById('zoomLevel').innerText = currentZoom + '%';
            document.getElementById('resumePreview').style.transform = `scale(${currentZoom / 100})`;
        }

        // ==========================================
        // RESET
        // ==========================================
        function resetResume() {
            if(confirm("Are you sure you want to reset ALL data? This cannot be undone.")) {
                localStorage.removeItem('omniUltimateResume');
                location.reload();
            }
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function init() {
            // Populate form fields
            ['name', 'jobTitle', 'email', 'phone', 'location', 'linkedin', 'website', 'github', 'twitter', 'summary', 'skills', 'hobbies'].forEach(f => {
                const el = document.getElementById('input-' + f);
                if(el) el.value = resumeData[f] || '';
            });

            // Restore toolbar state
            document.getElementById('templateSelect').value = currentTemplate;
            document.getElementById('fontSelect').value = currentFont;
            document.getElementById('fontSizeSelect').value = currentFontSize;
            document.getElementById('colorPicker').value = currentColor;
            document.getElementById('bgSelect').value = currentBg;
            document.getElementById('photoShapeSelect').value = currentPhotoShape;
            document.getElementById('skillStyle').value = resumeData.skillStyle || 'tags';

            // Render all forms
            renderExperienceForm();
            renderEducationForm();
            renderProjectForm();
            renderLanguageForm();
            renderCertificationForm();
            renderAwardForm();
            renderReferenceForm();

            // Render preview
            renderPreview();

            // Initialize SortableJS for section reordering
            const previewEl = document.getElementById('resumePreview');
            new Sortable(previewEl, {
                animation: 150,
                handle: '.resume-section',
                ghostClass: 'sortable-ghost',
                filter: '.resume-header',
                onEnd: () => {
                    // Future: persist section order if needed
                }
            });
        }

        window.onload = init;
    </script>
