    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Pacifico&family=Great+Vibes&family=Satisfy&family=Allura&family=Caveat:wght@400;500;600;700&family=Indie+Flower&family=Shadows+Into+Light&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Kaushan+Script&family=Yellowtail&family=Sacramento&family=Parisienne&family=Cookie&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    </script>

    <style>
        /* =========================================
           ULTIMATE RESUME MAKER — 100 Templates Edition
           ========================================= */
        :root {
            --resume-primary: #2563eb;
            --resume-font: 'Inter', sans-serif;
            --resume-font-size: 13.5px;
            --resume-text-color: #333;
            --resume-bg-color: #ffffff;
            --resume-padding: 35px;
            --resume-line-height: 1.5;
            --resume-heading-font: 'Inter', sans-serif;
            --photo-shape: 50%;
            --section-style: 'underline';
        }

        * { box-sizing: border-box; }

        .resume-app-container {
            display: flex; height: calc(100vh - 100px);
            margin-top: 20px; background: var(--bg-color);
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            border: 1px solid var(--border-color);
        }

        .resume-form-panel {
            width: 420px; background: var(--bg-color);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            overflow-y: auto; flex-shrink: 0;
            scrollbar-width: thin;
        }
        .resume-form-panel::-webkit-scrollbar { width: 6px; }
        .resume-form-panel::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }

        .form-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between;
            align-items: center; background: var(--bg-color);
            position: sticky; top: 0; z-index: 10;
        }
        .form-header h2 { font-size: 16px; margin: 0; color: var(--primary-blue); }
        .btn-sm {
            font-size: 11px; padding: 6px 12px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }

        .accordion-item { border-bottom: 1px solid var(--border-color); }
        .accordion-header {
            padding: 14px 20px; background: rgba(0,0,0,0.02);
            cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; font-weight: 600; font-size: 13px;
            transition: 0.3s; user-select: none;
        }
        .accordion-header:hover { background: rgba(0,0,0,0.05); }
        .accordion-header i.chev { transition: transform 0.3s; font-size: 12px; }
        .accordion-header.active i.chev { transform: rotate(180deg); }
        .accordion-content { padding: 20px; display: none; background: var(--bg-color); }
        .accordion-content.active { display: block; }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; font-size: 11px; font-weight: 600;
            margin-bottom: 5px; color: #888; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 9px 12px;
            border: 1px solid var(--border-color); border-radius: 6px;
            background: var(--bg-color); color: var(--text-color);
            font-family: inherit; font-size: 13px; transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .form-group textarea { resize: vertical; min-height: 70px; font-family: inherit; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        .dynamic-item {
            background: rgba(0,0,0,0.02); padding: 14px;
            border-radius: 8px; margin-bottom: 14px;
            border: 1px dashed var(--border-color); position: relative;
        }
        .dynamic-item .remove-btn {
            position: absolute; top: 8px; right: 10px;
            color: #ef4444; cursor: pointer; font-size: 13px;
            padding: 4px; border-radius: 4px; transition: 0.2s;
        }
        .dynamic-item .remove-btn:hover { background: rgba(239,68,68,0.1); }

        .add-btn {
            width: 100%; padding: 10px;
            background: rgba(37,99,235,0.08); color: var(--primary-blue);
            border: 1px dashed var(--primary-blue); border-radius: 6px;
            cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.3s;
        }
        .add-btn:hover { background: var(--primary-blue); color: white; border-style: solid; }

        /* ============= RIGHT PANEL ============= */
        .resume-preview-panel {
            flex: 1; background: #3a3d42;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .preview-toolbar {
            padding: 8px 15px; background: #23262b;
            display: flex; justify-content: space-between;
            align-items: center; color: white; flex-wrap: wrap;
            gap: 8px; border-bottom: 1px solid #111;
        }
        .preview-toolbar .tool-group {
            display: flex; gap: 6px; align-items: center; font-size: 12px;
        }
        .preview-toolbar .tool-group label { color: #aaa; font-size: 11px; }
        .preview-toolbar select, .preview-toolbar input[type="color"] {
            padding: 5px 8px; border-radius: 4px; border: 1px solid #444;
            background: #1a1c20; color: white; cursor: pointer;
            font-size: 11px; font-family: inherit;
            max-width: 160px;
        }
        .preview-toolbar input[type="color"] { width: 32px; height: 28px; padding: 2px; }
        .preview-toolbar select:hover { border-color: #666; }

        .btn-download {
            padding: 6px 14px; background: #10b981; color: white;
            border: none; border-radius: 4px; cursor: pointer;
            font-weight: 600; font-size: 11px; display: flex;
            align-items: center; gap: 5px; transition: 0.2s;
        }
        .btn-download:hover { background: #059669; }

        .zoom-controls {
            display: flex; align-items: center; gap: 3px;
            background: #1a1c20; border-radius: 4px; padding: 2px;
        }
        .zoom-controls button {
            background: transparent; color: white; border: none;
            padding: 4px 8px; cursor: pointer; font-size: 12px; border-radius: 3px;
        }
        .zoom-controls button:hover { background: #333; }
        .zoom-controls span {
            font-size: 11px; padding: 0 4px; color: #ccc;
            min-width: 35px; text-align: center;
        }

        .preview-scroll-area {
            flex: 1; overflow: auto; padding: 30px;
            display: flex; justify-content: center; align-items: flex-start;
        }

        /* ============= A4 PAGE ============= */
        .a4-page {
            width: 210mm; min-height: 297mm;
            background: var(--resume-bg-color);
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            padding: var(--resume-padding);
            color: var(--resume-text-color);
            font-family: var(--resume-font);
            font-size: var(--resume-font-size);
            line-height: var(--resume-line-height);
            position: relative; box-sizing: border-box;
            transition: transform 0.2s;
            transform-origin: top center;
        }

        /* Background Patterns */
        .a4-page.bg-white { --resume-bg-color: #ffffff; }
        .a4-page.bg-cream { --resume-bg-color: #fdfaf3; }
        .a4-page.bg-gray { --resume-bg-color: #f5f5f5; }
        .a4-page.bg-offwhite { --resume-bg-color: #fafaf7; }
        .a4-page.bg-grid {
            background-color: #ffffff;
            background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .a4-page.bg-dots {
            background-color: #ffffff;
            background-image: radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
            background-size: 15px 15px;
        }
        .a4-page.bg-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #f0f4ff 100%);
        }
        .a4-page.bg-subtle-lines {
            background-color: #ffffff;
            background-image: linear-gradient(rgba(37,99,235,0.03) 1px, transparent 1px);
            background-size: 100% 24px;
        }

        /* ============= HEADER ============= */
        .resume-header {
            display: flex; align-items: center; justify-content: center;
            gap: 25px; margin-bottom: 22px;
            padding-bottom: 18px; text-align: center;
        }
        .header-photo-container {
            width: 110px; height: 110px; overflow: hidden;
            flex-shrink: 0; display: none; background: #f0f0f0;
            border: 3px solid var(--resume-primary);
            border-radius: var(--photo-shape);
        }
        .header-photo-container img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; min-width: 0; }
        .resume-header h1 {
            font-size: 32px; margin: 0 0 5px 0;
            color: var(--resume-primary);
            text-transform: uppercase; letter-spacing: 2px;
            font-family: var(--resume-heading-font);
            font-weight: 700; line-height: 1.1;
        }
        .resume-header .job-title {
            font-size: 15px; font-weight: 600;
            color: #555; margin-bottom: 10px; letter-spacing: 0.5px;
        }
        .resume-header .contact-info {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 6px 15px; font-size: 11.5px; color: #666;
        }
        .resume-header .contact-info span { display: flex; align-items: center; gap: 5px; }
        .resume-header .contact-info i { color: var(--resume-primary); }

        /* ============= SECTIONS ============= */
        .resume-section { margin-bottom: 18px; }
        .resume-section h2 {
            font-size: 14px; text-transform: uppercase;
            color: var(--resume-primary); padding-bottom: 5px;
            margin-bottom: 10px; letter-spacing: 1.5px;
            font-family: var(--resume-heading-font);
            font-weight: 700;
            border-bottom: 2px solid var(--resume-primary);
            display: flex; align-items: center; gap: 8px;
        }
        .resume-section h2 i { font-size: 13px; }

        .resume-item { margin-bottom: 14px; }
        .resume-item-header {
            display: flex; justify-content: space-between;
            align-items: baseline; margin-bottom: 3px; gap: 10px;
        }
        .resume-item-header h3 { font-size: 13.5px; margin: 0; font-weight: 700; color: #222; }
        .resume-item-header .date { font-size: 11.5px; color: #666; font-style: italic; white-space: nowrap; }
        .resume-item-sub { font-size: 12.5px; font-weight: 600; color: #444; margin-bottom: 4px; font-style: italic; }
        .resume-item p { font-size: 12.5px; margin: 0 0 4px 0; color: #555; }
        .resume-item ul { margin: 4px 0 0 0; padding-left: 18px; font-size: 12.5px; color: #555; }
        .resume-item ul li { margin-bottom: 3px; }

        .skills-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .skill-tag {
            background: rgba(37,99,235,0.1); color: var(--resume-primary);
            padding: 3px 12px; border-radius: 20px;
            font-size: 11.5px; font-weight: 600;
            border: 1px solid rgba(37,99,235,0.2);
        }
        .skill-bar-item { margin-bottom: 10px; }
        .skill-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
        .skill-bar-track { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
        .skill-bar-fill { height: 100%; background: var(--resume-primary); border-radius: 3px; transition: width 0.5s; }
        .lang-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12.5px; }
        .lang-name { font-weight: 600; }
        .lang-level { color: #666; font-style: italic; font-size: 11.5px; }

        /* ============================================
           BASE LAYOUT VARIATIONS (10 Layouts)
           ============================================ */

        /* MODERN */
        .a4-page.layout-modern .resume-header { border-bottom: 2px solid var(--resume-primary); }
        .a4-page.layout-modern .resume-header h1 { color: var(--resume-primary); }

        /* CLASSIC */
        .a4-page.layout-classic .resume-header {
            text-align: left; border-bottom: 3px double #333;
            justify-content: flex-start;
        }
        .a4-page.layout-classic .resume-header h1 { color: #1a1a1a; letter-spacing: 1px; }
        .a4-page.layout-classic .resume-header .contact-info { justify-content: flex-start; }
        .a4-page.layout-classic .resume-section h2 {
            color: #1a1a1a; border-bottom: 2px solid #1a1a1a;
            text-align: center; letter-spacing: 2px;
        }
        .a4-page.layout-classic .skill-tag {
            background: transparent; color: #1a1a1a; border: 1px solid #1a1a1a;
        }
        .a4-page.layout-classic .header-photo-container { border-color: #1a1a1a; }

        /* MINIMAL */
        .a4-page.layout-minimal .resume-header {
            border-bottom: 1px solid #e5e5e5; text-align: left;
        }
        .a4-page.layout-minimal .resume-header h1 {
            font-size: 36px; color: #111; letter-spacing: -0.5px; font-weight: 300;
        }
        .a4-page.layout-minimal .resume-header .contact-info { justify-content: flex-start; }
        .a4-page.layout-minimal .resume-section h2 {
            color: #111; border-bottom: 1px solid #e5e5e5;
            font-weight: 400; letter-spacing: 3px; font-size: 12px;
        }
        .a4-page.layout-minimal .skill-tag { background: #f5f5f5; color: #333; border: none; }
        .a4-page.layout-minimal .resume-header .contact-info i { color: #111; }

        /* EXECUTIVE */
        .a4-page.layout-executive .resume-header {
            text-align: center; border-bottom: none;
            padding: 25px 20px; margin: -35px -35px 25px -35px;
            background: var(--resume-primary); color: white;
        }
        .a4-page.layout-executive .resume-header h1 { color: white; letter-spacing: 3px; }
        .a4-page.layout-executive .resume-header .job-title { color: rgba(255,255,255,0.9); }
        .a4-page.layout-executive .resume-header .contact-info { color: rgba(255,255,255,0.9); }
        .a4-page.layout-executive .resume-header .contact-info i { color: white; }
        .a4-page.layout-executive .resume-section h2 { color: var(--resume-primary); border-bottom: 1px solid #ddd; }
        .a4-page.layout-executive .header-photo-container { border-color: white; }

        /* ELEGANT */
        .a4-page.layout-elegant .resume-header {
            text-align: center; border-top: 1px solid #c9a96a;
            border-bottom: 1px solid #c9a96a; padding: 20px 0; margin-bottom: 25px;
        }
        .a4-page.layout-elegant .resume-header h1 { color: #1a1a1a; letter-spacing: 4px; font-weight: 400; }
        .a4-page.layout-elegant .resume-section h2 {
            color: #c9a96a; border-bottom: 1px solid #c9a96a;
            text-align: center; letter-spacing: 3px; font-weight: 400;
        }
        .a4-page.layout-elegant .skill-tag { background: rgba(201,169,106,0.1); color: #8a6d3a; border: 1px solid rgba(201,169,106,0.3); }
        .a4-page.layout-elegant .header-photo-container { border-color: #c9a96a; }

        /* BOLD */
        .a4-page.layout-bold .resume-header {
            background: #111; color: white;
            padding: 30px 25px; margin: -35px -35px 25px -35px;
            border-bottom: 6px solid var(--resume-primary);
        }
        .a4-page.layout-bold .resume-header h1 { color: white; font-weight: 800; letter-spacing: 3px; font-size: 34px; }
        .a4-page.layout-bold .resume-header .job-title { color: var(--resume-primary); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; font-size: 12px; }
        .a4-page.layout-bold .resume-header .contact-info { color: rgba(255,255,255,0.8); }
        .a4-page.layout-bold .resume-header .contact-info i { color: var(--resume-primary); }
        .a4-page.layout-bold .resume-section h2 { color: #111; border-bottom: 3px solid #111; letter-spacing: 3px; font-weight: 800; }
        .a4-page.layout-bold .header-photo-container { border-color: var(--resume-primary); }

        /* COMPACT */
        .a4-page.layout-compact { --resume-padding: 22px; --resume-font-size: 12px; --resume-line-height: 1.35; }
        .a4-page.layout-compact .resume-header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .a4-page.layout-compact .resume-header h1 { font-size: 26px; letter-spacing: 1px; }
        .a4-page.layout-compact .resume-section { margin-bottom: 12px; }
        .a4-page.layout-compact .resume-section h2 { font-size: 12px; margin-bottom: 8px; padding-bottom: 3px; }
        .a4-page.layout-compact .resume-item { margin-bottom: 10px; }

        /* TIMELINE */
        .a4-page.layout-timeline .resume-header { text-align: left; border-bottom: 1px solid #ddd; }
        .a4-page.layout-timeline .resume-header .contact-info { justify-content: flex-start; }
        .a4-page.layout-timeline .resume-section { position: relative; padding-left: 30px; }
        .a4-page.layout-timeline .resume-section::before {
            content: ''; position: absolute; left: 8px; top: 25px;
            bottom: 0; width: 2px; background: var(--resume-primary); opacity: 0.3;
        }
        .a4-page.layout-timeline .resume-section h2 {
            border-bottom: none; padding-bottom: 0;
            position: relative; margin-left: -22px;
        }
        .a4-page.layout-timeline .resume-section h2::before {
            content: ''; position: absolute; left: 0; top: 5px;
            width: 12px; height: 12px; background: var(--resume-primary);
            border-radius: 50%; border: 3px solid white;
            box-shadow: 0 0 0 2px var(--resume-primary);
        }
        .a4-page.layout-timeline .resume-item-header h3::before {
            content: '▸ '; color: var(--resume-primary); font-weight: bold;
        }

        /* TWO-COLUMN */
        .a4-page.layout-twocolumn {
            display: grid; grid-template-columns: 1fr 32%;
            gap: 30px; padding: 35px 30px;
        }
        .a4-page.layout-twocolumn .resume-header {
            grid-column: 1 / -1; border-bottom: 2px solid var(--resume-primary);
            text-align: left; padding-bottom: 15px;
        }

        .a4-page.layout-creative {

        }

            padding: 30px 20px; min-height: 297mm;
        }

            font-size: 12px; letter-spacing: 1.5px;
        }
        .a4-page.layout-creative .resume-sidebar .resume-item,

        .a4-page.layout-creative .resume-sidebar .skill-tag {
            background: rgba(255,255,255,0.15); color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .a4-page.layout-creative .resume-sidebar .skill-bar-track { background: rgba(255,255,255,0.2); }
        .a4-page.layout-creative .resume-sidebar .skill-bar-fill { background: white; }
        .a4-page.layout-creative .resume-main h2 {
            color: var(--resume-primary); border-bottom: 2px solid var(--resume-primary);
        }
        .a4-page.layout-creative .sidebar-photo {
            width: 130px; height: 130px; margin: 0 auto 20px;
            border-radius: var(--photo-shape); overflow: hidden;
            border: 3px solid rgba(255,255,255,0.5);
        }
        .a4-page.layout-creative .sidebar-photo img { width: 100%; height: 100%; object-fit: cover; }
        .a4-page.layout-creative .sidebar-name { font-size: 22px; font-weight: 700; margin-bottom: 5px; line-height: 1.2; }
        .a4-page.layout-creative .sidebar-title { font-size: 12px; opacity: 0.85; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .a4-page.layout-creative .sidebar-contact { font-size: 11px; margin-bottom: 6px; word-break: break-word; display: flex; gap: 8px; align-items: flex-start; }
        .a4-page.layout-creative .sidebar-contact i { margin-top: 3px; flex-shrink: 0; }

        /* ============= PRINT STYLES ============= */
        @media print {
            body * { visibility: hidden; }
            .resume-preview-panel, .resume-preview-panel * { visibility: visible; }
            .resume-preview-panel {
                position: absolute; left: 0; top: 0;
                width: 100%; height: auto; background: white; overflow: visible;
            }
            .preview-toolbar { display: none !important; }
            .preview-scroll-area { padding: 0; overflow: visible; display: block; }
            .a4-page {

                margin: 0; padding: 15mm !important; transform: none !important;

            .a4-page.layout-creative { grid-template-columns: 32% 1fr; }

            {suffix:'Purple',  color:'#7c3aed', font:'Playfair Display',bg:'bg-white'},
            {suffix:'Orange',  color:'#ea580c', font:'Montserrat',      bg:'bg-gradient'},
            {suffix:'Teal',    color:'#0d9488', font:'Lora',            bg:'bg-white'},
            {suffix:'Rose',    color:'#e11d48', font:'Raleway',         bg:'bg-gray'},

            {suffix:'Indigo',  color:'#4f46e5', font:'Cormorant Garamond', bg:'bg-subtle-lines'}
        ];

        // Generate 100 templates
        const TEMPLATES = [];
        let tid = 1;
        LAYOUTS.forEach(layout => {
            STYLE_COMBOS.forEach((style, i) => {
                TEMPLATES.push({
                    id: tid++,
                    name: `${layout.name} ${style.suffix}`,
                    layout: layout.id,
                    layoutName: layout.name,
                    color: style.color,
                    font: style.font,
                    bg: style.bg,
                    photoShape: ['50%','8px','0%'][i % 3]
                });
            });
        });

        // ============================================================
        // STATE
        // ============================================================
        const defaultData = {
            photo:"", name:"", jobTitle:"", email:"", phone:"", location:"",
            linkedin:"", website:"", github:"", twitter:"",
            summary:"", skills:"", skillStyle:"tags", hobbies:"",
            experience:[], education:[], projects:[],
            languages:[], certifications:[], awards:[], references:[]
        };
        let resumeData = JSON.parse(localStorage.getItem('omniUltimateResumeV2')) || JSON.parse(JSON.stringify(defaultData));

        if(!resumeData.experience || resumeData.experience.length === 0) resumeData.experience = [{title:'',company:'',date:'',desc:''}];
        if(!resumeData.education || resumeData.education.length === 0) resumeData.education = [{degree:'',school:'',date:'',desc:''}];
        if(!resumeData.projects || resumeData.projects.length === 0) resumeData.projects = [{title:'',tech:'',desc:''}];
        if(!resumeData.languages) resumeData.languages = [];
        if(!resumeData.certifications) resumeData.certifications = [];
        if(!resumeData.awards) resumeData.awards = [];
        if(!resumeData.references) resumeData.references = [];
        if(!resumeData.skillStyle) resumeData.skillStyle = 'tags';

        // State variables
        let currentTemplateId = parseInt(localStorage.getItem('omniTplIdV2')) || 1;
        let currentFont = localStorage.getItem('omniFontV2') || 'Inter';
        let currentFontSize = localStorage.getItem('omniFontSizeV2') || '13.5px';
        let currentColor = localStorage.getItem('omniColorV2') || '#2563eb';
        let currentBg = localStorage.getItem('omniBgV2') || 'bg-white';
        let currentPhotoShape = localStorage.getItem('omniPhotoV2') || '50%';
        let currentZoom = 100;

        // ============================================================
        // ACCORDION
        // ============================================================
        function toggleAccordion(header) {
            header.classList.toggle('active');
            header.nextElementSibling.classList.toggle('active');
        }

        // ============================================================
        // PHOTO UPLOAD
        // ============================================================
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                resumeData.photo = e.target.result;
                saveData();
                renderPreview();
            };
            reader.readAsDataURL(file);
        }

        // ============================================================
        // PERSISTENCE
        // ============================================================
        function saveData() {
            localStorage.setItem('omniUltimateResumeV2', JSON.stringify(resumeData));
        }
        function updateData(field, value) {
            resumeData[field] = value;
            saveData();
            renderPreview();
        }

        // ============================================================
        // APPLY TEMPLATE (Full preset)
        // ============================================================
        function applyTemplate(id) {
            const t = TEMPLATES.find(x => x.id === parseInt(id));
            if(!t) return;
            currentTemplateId = t.id;
            currentColor = t.color;
            currentFont = t.font;
            currentBg = t.bg;
            currentPhotoShape = t.photoShape;
            
            // Update UI controls
            document.getElementById('colorPicker').value = t.color;
            document.getElementById('fontSelect').value = t.font;
            document.getElementById('bgSelect').value = t.bg;
            document.getElementById('photoShapeSelect').value = t.photoShape;
            
            // Save
            localStorage.setItem('omniTplIdV2', t.id);
            localStorage.setItem('omniColorV2', t.color);
            localStorage.setItem('omniFontV2', t.font);
            localStorage.setItem('omniBgV2', t.bg);
            localStorage.setItem('omniPhotoV2', t.photoShape);
            
            renderPreview();
        }

        // ============================================================
        // RENDER PREVIEW
        // ============================================================
        function renderPreview() {
            const t = TEMPLATES.find(x => x.id === currentTemplateId) || TEMPLATES[0];
            const preview = document.getElementById('resumePreview');
            
            // Get font stack
            const fontObj = FONTS.find(f => f.name === currentFont) || FONTS[0];
            const fontStack = fontObj.stack;
            
            // Apply CSS variables
            document.documentElement.style.setProperty('--resume-primary', currentColor);
            document.documentElement.style.setProperty('--resume-font', fontStack);
            document.documentElement.style.setProperty('--resume-heading-font', fontStack);
            document.documentElement.style.setProperty('--resume-font-size', currentFontSize);
            document.documentElement.style.setProperty('--photo-shape', currentPhotoShape);
            
            // Set class
            preview.className = `a4-page layout-${t.layout} ${currentBg}`;
            
            // Build contacts
            const contacts = [];
            if(resumeData.email) contacts.push(`<span><i class="fas fa-envelope"></i> ${esc(resumeData.email)}</span>`);
            if(resumeData.phone) contacts.push(`<span><i class="fas fa-phone"></i> ${esc(resumeData.phone)}</span>`);
            if(resumeData.location) contacts.push(`<span><i class="fas fa-map-marker-alt"></i> ${esc(resumeData.location)}</span>`);
            if(resumeData.linkedin) contacts.push(`<span><i class="fab fa-linkedin"></i> ${esc(resumeData.linkedin)}</span>`);
            if(resumeData.website) contacts.push(`<span><i class="fas fa-globe"></i> ${esc(resumeData.website)}</span>`);
            if(resumeData.github) contacts.push(`<span><i class="fab fa-github"></i> ${esc(resumeData.github)}</span>`);
            if(resumeData.twitter) contacts.push(`<span><i class="fab fa-twitter"></i> ${esc(resumeData.twitter)}</span>`);
            
            // Build all sections
            const summaryHtml = buildSummary();
            const expHtml = buildExperience();
            const eduHtml = buildEducation();
            const skillHtml = buildSkills();
            const langHtml = buildLanguages();
            const projHtml = buildProjects();
            const certHtml = buildCertifications();
            const awardsHtml = buildAwards();
            const hobHtml = buildHobbies();
            const refHtml = buildReferences();
            
            const photoHtml = resumeData.photo ? `<img src="${resumeData.photo}" alt="Photo">` : '';
            
            // Special layouts
            if(t.layout === 'creative') {
                preview.innerHTML = `
                    <div class="resume-sidebar">
                        ${resumeData.photo ? `<div class="sidebar-photo">${photoHtml}</div>` : ''}
                        <div class="sidebar-name">${esc(resumeData.name) || 'Your Name'}</div>
                        <div class="sidebar-title">${esc(resumeData.jobTitle) || 'Job Title'}</div>
                        <div class="resume-section">
                            <h2>Contact</h2>
                            ${contacts.map(c => `<div class="sidebar-contact">${c.replace('<span>','').replace('</span>','')}</div>`).join('')}
                        </div>
                        ${skillHtml ? `<div class="resume-section">${stripWrapper(skillHtml, 'skills')}</div>` : ''}
                        ${langHtml}
                        ${hobHtml}
                    </div>
                    <div class="resume-main">
                        ${summaryHtml}
                        ${expHtml}
                        ${eduHtml}
                        ${projHtml}
                        ${certHtml}
                        ${awardsHtml}
                        ${refHtml}
                    </div>
                `;
            } else if(t.layout === 'twocolumn') {
                preview.innerHTML = `
                    <div class="resume-header">
                        ${resumeData.photo ? `<div class="header-photo-container" style="display:block">${photoHtml}</div>` : ''}
                        <div class="header-info">
                            <h1>${esc(resumeData.name) || 'Your Name'}</h1>
                            <div class="job-title">${esc(resumeData.jobTitle) || 'Job Title'}</div>
                            <div class="contact-info">${contacts.join('')}</div>
                        </div>
                    </div>
                    <div class="main-column">
                        ${summaryHtml}
                        ${expHtml}
                        ${eduHtml}
                        ${projHtml}
                    </div>
                    <div class="side-column">
                        ${skillHtml}
                        ${langHtml}
                        ${certHtml}
                        ${awardsHtml}
                        ${hobHtml}
                        ${refHtml}
                    </div>
                `;
            } else {
                preview.innerHTML = `
                    <div class="resume-header">
                        ${resumeData.photo ? `<div class="header-photo-container" style="display:block">${photoHtml}</div>` : ''}
                        <div class="header-info">
                            <h1>${esc(resumeData.name) || 'Your Name'}</h1>
                            <div class="job-title">${esc(resumeData.jobTitle) || 'Job Title'}</div>
                            <div class="contact-info">${contacts.join('')}</div>
                        </div>
                    </div>
                    ${summaryHtml}
                    ${expHtml}
                    ${eduHtml}
                    ${skillHtml}
                    ${langHtml}
                    ${projHtml}
                    ${certHtml}
                    ${awardsHtml}
                    ${hobHtml}
                    ${refHtml}
                `;
            }
            
            // Update zoom
            preview.style.transform = `scale(${currentZoom / 100})`;
        }

        function stripWrapper(html, section) {
            // Remove the outer .resume-section div for creative sidebar
            const temp = document.createElement('div');
            temp.innerHTML = html;
            const sectionEl = temp.querySelector('.resume-section');
            if(!sectionEl) return html;
            const h2 = sectionEl.querySelector('h2');
            const inner = sectionEl.innerHTML.replace(h2.outerHTML, '');
            return `<h2>${h2.innerHTML}</h2>${inner}`;
        }

        // ============================================================
        // SECTION BUILDERS
        // ============================================================
        function buildSummary() {
            if(!resumeData.summary) return '';
            return `<div class="resume-section"><h2><i class="fas fa-align-left"></i> Professional Summary</h2><p>${esc(resumeData.summary)}</p></div>`;
        }
        function buildExperience() {
            const valid = resumeData.experience.filter(e => e.title || e.company);
            if(!valid.length) return '';
            return `<div class="resume-section"><h2><i class="fas fa-briefcase"></i> Work Experience</h2>
                ${valid.map(e => `<div class="resume-item">
                    <div class="resume-item-header"><h3>${esc(e.title)||'Job Title'}</h3><span class="date">${esc(e.date)||''}</span></div>
                    <div class="resume-item-sub">${esc(e.company)||'Company'}</div>
                    ${e.desc?`<ul>${e.desc.split('\n').map(l=>l.trim()?`<li>${esc(l)}</li>`:'').join('')}</ul>`:''}
                </div>`).join('')}</div>`;
        }
        function buildEducation() {
            const valid = resumeData.education.filter(e => e.degree || e.school);
            if(!valid.length) return '';
            return `<div class="resume-section"><h2><i class="fas fa-graduation-cap"></i> Education</h2>
                ${valid.map(e => `<div class="resume-item">

                    <div class="resume-item-sub">${esc(e.school)||'School'}</div>
                    ${e.desc?`<p>${esc(e.desc)}</p>`:''}
                </div>`).join('')}</div>`;
        }
        function buildSkills() {
            if(!resumeData.skills) return '';
            const skills = resumeData.skills.split(',').map(s=>s.trim()).filter(s=>s);
            if(!skills.length) return '';
            let content;
            if(resumeData.skillStyle === 'bars') {
                content = skills.map(s => `<div class="skill-bar-item"><div class="skill-bar-label"><span>${esc(s)}</span><span>85%</span></div><div class="skill-bar-track"><div class="skill-bar-fill" style="width:85%"></div></div></div>`).join('');
            } else {
                content = `<div class="skills-list">${skills.map(s=>`<span class="skill-tag">${esc(s)}</span>`).join('')}</div>`;
            }
            return `<div class="resume-section"><h2><i class="fas fa-cogs"></i> Skills</h2>${content}</div>`;
        }
        function buildLanguages() {
            const valid = resumeData.languages.filter(l => l.name);
            if(!valid.length) return '';
            return `<div class="resume-section"><h2><i class="fas fa-language"></i> Languages</h2>
                ${valid.map(l => `<div class="lang-item"><span class="lang-name">${esc(l.name)}</span><span class="lang-level">${esc(l.level)||''}</span></div>`).join('')}</div>`;

            const valid = resumeData.projects.filter(p => p.title);

            if(!text) return '';

                <div class="dynamic-item">
                    <i class="fas fa-trash remove-btn" onclick="removeReference(${i})"></i>
                    <div class="form-group"><label>Name</label><input type="text" value="${esc(r.name)}" oninput="updateReference(${i},'name',this.value)" placeholder="Jane Smith"></div>
                    <div class="form-row">
                        <div class="form-group"><label>Position</label><input type="text" value="${esc(r.position)}" oninput="updateReference(${i},'position',this.value)" placeholder="Manager"></div>
                        <div class="form-group"><label>Company</label><input type="text" value="${esc(r.company)}" oninput="updateReference(${i},'company',this.value)" placeholder="Tech Corp"></div>
                    </div>
                    <div class="form-group"><label>Contact</label><input type="text" value="${esc(r.contact)}" oninput="updateReference(${i},'contact',this.value)" placeholder="jane@example.com"></div>
                </div>
            `).join('');
        }
        function updateReference(i,f,v){resumeData.references[i][f]=v;saveData();renderPreview();}
        function removeReference(i){resumeData.references.splice(i,1);renderReferenceForm();renderPreview();saveData();}

        // ============================================================
        // TOOLBAR FUNCTIONS
        // ============================================================
        function changeFont(fontName) {
            currentFont = fontName;
            localStorage.setItem('omniFontV2', fontName);
            renderPreview();
        }
        function changeFontSize(s) {
            currentFontSize = s;
            localStorage.setItem('omniFontSizeV2', s);
            renderPreview();
        }
        function changeColor(c) {
            currentColor = c;
            localStorage.setItem('omniColorV2', c);
            renderPreview();
        }
        function changeBackground(b) {
            currentBg = b;
            localStorage.setItem('omniBgV2', b);
            renderPreview();
        }
        function changePhotoShape(s) {
            currentPhotoShape = s;
            localStorage.setItem('omniPhotoV2', s);
            renderPreview();
        }
        function changeZoom(delta) {
            currentZoom = Math.max(30, Math.min(150, currentZoom + delta));
            document.getElementById('zoomLevel').innerText = currentZoom + '%';
            document.getElementById('resumePreview').style.transform = `scale(${currentZoom / 100})`;
        }

        // ============================================================
        // RESET
        // ============================================================
        function resetResume() {
            if(confirm("Are you sure you want to reset ALL data? This cannot be undone.")) {
                localStorage.removeItem('omniUltimateResumeV2');
                location.reload();
            }
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        function init() {
            // Populate template dropdown (grouped by layout)
            const tplSelect = document.getElementById('templateSelect');
            let lastLayout = '';
            let html = '';
            TEMPLATES.forEach(t => {
                if(t.layoutName !== lastLayout) {
                    if(lastLayout !== '') html += '</optgroup>';
                    html += `<optgroup label="───── ${t.layoutName} ─────">`;
                    lastLayout = t.layoutName;
                }
                html += `<option value="${t.id}" ${t.id === currentTemplateId ? 'selected' : ''}>${t.id}. ${t.name}</option>`;
            });
            html += '</optgroup>';
            tplSelect.innerHTML = html;

            // Populate font dropdown (grouped by category)
            const fontSelect = document.getElementById('fontSelect');
            const cats = ['Sans','Serif','Display','Script','System'];
            let fhtml = '';
            cats.forEach(cat => {
                const fonts = FONTS.filter(f => f.cat === cat);
                if(fonts.length === 0) return;
                fhtml += `<optgroup label="${cat} Serif (${fonts.length})">`;
                fonts.forEach(f => {
                    fhtml += `<option value="${f.name}" ${f.name === currentFont ? 'selected' : ''}>${f.name}</option>`;
                });
                fhtml += '</optgroup>';
            });
            fontSelect.innerHTML = fhtml;

            // Restore state
            document.getElementById('fontSizeSelect').value = currentFontSize;
            document.getElementById('colorPicker').value = currentColor;
            document.getElementById('bgSelect').value = currentBg;
            document.getElementById('photoShapeSelect').value = currentPhotoShape;
            document.getElementById('skillStyle').value = resumeData.skillStyle || 'tags';

            // Populate personal info
            ['name','jobTitle','email','phone','location','linkedin','website','github','twitter','summary','skills','hobbies'].forEach(f => {
                const el = document.getElementById('input-' + f);
                if(el) el.value = resumeData[f] || '';
            });

            // Render all forms
            renderExperienceForm();
            renderEducationForm();
            renderProjectForm();
            renderLanguageForm();
            renderCertificationForm();
            renderAwardForm();
            renderReferenceForm();

            // Render preview
            renderPreview();

            // Sortable sections
            try {
                new Sortable(document.getElementById('resumePreview'), {
                    animation: 150, handle: '.resume-section',
                    ghostClass: 'sortable-ghost', filter: '.resume-header'
                });
            } catch(e) { console.log('Sortable init skipped'); }
        }

        window.onload = init;
    </script>
</body>
</html>
